# Builds the site and publishes it to Cloudflare Pages on every push to main.
# Needs the repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: legalease-website
    # Skips quietly until the Cloudflare secrets are added to the repo.
    steps:
      - name: Check for Cloudflare secrets
        id: check
        run: echo "ok=${{ env.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.ok == 'true'
      - run: npm run build
        if: steps.check.outputs.ok == 'true'
      # Creates the Pages project the first time; later runs skip it.
      - name: Create Pages project if missing
        if: steps.check.outputs.ok == 'true'
        run: npx --yes wrangler@4.20.0 pages project create "$PROJECT" --production-branch=main || true
      - name: Publish
        if: steps.check.outputs.ok == 'true'
        run: npx --yes wrangler@4.20.0 pages deploy out --project-name="$PROJECT" --branch=main --commit-dirty=true
